<script>
  // Resolve helper for assets referenced as JS strings (no-op when not bundled).
  window.__r = function(p) { return (window.__resources && window.__resources[p]) || p; };
  // After data loads, rewrite paths inside HA_SELLERS / HA_LISTINGS.
  window.__rewriteHAPaths = function() {
    if (!window.__resources) return;
    if (window.HA_SELLERS) Object.values(window.HA_SELLERS).forEach(s => { if (s.avatar) s.avatar = window.__r(s.avatar); });
    if (window.HA_LISTINGS) window.HA_LISTINGS.forEach(l => {
      if (l.image) l.image = window.__r(l.image);
      if (l.images) l.images = l.images.map(window.__r);
    });
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "default",
  "density": "two",
  "city": "tel-aviv"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const palette = window.HA_PALETTES[tweaks.palette] || window.HA_PALETTES.default;
  const [city, setCity] = useState(tweaks.city);

  return (
    <div>
      {/* Header */}
      <header className="ha-shell" data-screen-label="Header">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div className="ha-eyebrow">Maya Levin · Case study, 2026</div>
          <a href="#" style={{ color: '#8C8478', fontSize: 12, textDecoration: 'underline' }}>← Back to portfolio</a>
        </div>
        <h1 className="ha-title">Home Again<br/><em>a marketplace for life in transit.</em></h1>
        <p className="ha-sub">
          A peer-to-peer marketplace for the moment between two homes. Buy and sell furniture, vehicles, and apartments
          with human context, real-time status, and built-in ways to ask, meet, and pay. Mobile · Speculative · 8 weeks · Solo product designer.
        </p>
        <div className="ha-meta">
          <dl><dt>Role</dt><dd>Product designer (solo)</dd></dl>
          <dl><dt>Timeline</dt><dd>8 weeks</dd></dl>
          <dl><dt>Platform</dt><dd>iOS · iPhone</dd></dl>
          <dl><dt>Tools</dt><dd>Figma · Protopie</dd></dl>
          <dl><dt>Status</dt><dd>Speculative</dd></dl>
        </div>
      </header>

      {/* Design canvas with all the screens */}
      <DesignCanvas>
        <DCSection id="prototype" title="Interactive prototype" subtitle="A working flow — tap any card to step through. Use Tweaks to switch palette, city, and density.">
          <DCArtboard id="play" label="Live · tap through" width={420} height={860}>
            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', background: '#efece6', padding: '20px 14px', boxSizing: 'border-box' }}>
              <HAFrame screen="browse" role="buyer" listingId="l-sofa" palette={palette} density={tweaks.density} city={city} setCity={setCity} scale={1} />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="First-run" subtitle="Three principles introduced before the feed loads — whole sellers, search by city, status you can trust.">
          <DCArtboard id="o-onboarding" label="Onboarding"          width={400} height={820}><HAFrame screen="onboarding" palette={palette} hideTabBar /></DCArtboard>
          <DCArtboard id="o-search"     label="Search · pick a city" width={400} height={820}><HAFrame screen="search" listingId="l-sofa" palette={palette} density={tweaks.density} city={city} setCity={setCity} /></DCArtboard>
        </DCSection>

        {/* ───────── BUYER FLOW ───────── */}
        <DCSection id="buyer-flow" title="Buyer flow · browse → ask → meet → reserve → pay → handoff" subtitle="The progressive-commitment funnel from a buyer's perspective. Tab bar shows Browse · Search · Favorites · Inbox · Me. The wordmark's 'again' tints orange for buyers.">
          <DCArtboard id="b-browse"   label="01 · Browse"            width={400} height={820}><HAFrame screen="browse"   role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="b-listing"  label="02 · Listing"           width={400} height={820}><HAFrame screen="listing"  role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="b-chat"     label="03 · Ask"               width={400} height={820}><HAFrame screen="chat"     role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="b-meet"     label="04 · Meet"              width={400} height={820}><HAFrame screen="meet"     role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="b-reserve"  label="05 · Reserve · escrow"  width={400} height={820}><HAFrame screen="reserve"  role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="b-handoff"  label="06 · Handoff · settled" width={400} height={820}><HAFrame screen="handoff"  role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
        </DCSection>

        <DCSection id="buyer-profile" title="Buyer profile · Me" subtitle="Where a buyer's whole life on Home Again lives — ongoing negotiations, favorites, threads, and pickup grouping.">
          <DCArtboard id="me-negotiations" label="Me · Negotiations" width={400} height={820}><HAFrame screen="me" role="buyer" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="me-favorites"    label="Me · Favorites"    width={400} height={820}><HAFrame screen="me" role="buyer" palette={palette} density={tweaks.density} city={city} meTab="Favorites" /></DCArtboard>
          <DCArtboard id="me-messages"     label="Me · Messages"     width={400} height={820}><HAFrame screen="me" role="buyer" palette={palette} density={tweaks.density} city={city} meTab="Messages" /></DCArtboard>
          <DCArtboard id="me-settings"     label="Me · Settings"     width={400} height={820}><HAFrame screen="me" role="buyer" palette={palette} density={tweaks.density} city={city} meTab="Settings" /></DCArtboard>
        </DCSection>

        <DCSection id="buyer-status" title="Buyer · status system" subtitle="One listing, four states. Status is a first-class part of the UI — visible on the card, the listing, and every chat thread.">
          <DCArtboard id="bs-available" label="Available"      width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="bs-onhold"    label="On hold · 48h"  width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-vespa" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="bs-back"      label="Back on market" width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-bike"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="bs-sold"      label="Sold"           width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-table" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
        </DCSection>

        <DCSection id="buyer-cities" title="Buyer · search by city" subtitle="Pickup is the whole point. Buyers choose a destination first; the feed only shows movers in that city.">
          <DCArtboard id="bc-tlv" label="Browse · Tel Aviv"  width={400} height={820}><HAFrame screen="browse" role="buyer" listingId="l-sofa" palette={palette} density={tweaks.density} city="tel-aviv"  /></DCArtboard>
          <DCArtboard id="bc-jrs" label="Browse · Jerusalem" width={400} height={820}><HAFrame screen="browse" role="buyer" listingId="l-desk" palette={palette} density={tweaks.density} city="jerusalem" /></DCArtboard>
        </DCSection>

        <DCSection id="buyer-categories" title="Buyer · mixed inventory" subtitle="The listing pattern works across categories. Same anatomy: status, photo, seller story, low-commitment actions.">
          <DCArtboard id="bc-furniture" label="Furniture · sofa"     width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-sofa"  palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="bc-vehicle"   label="Vehicle · scooter"    width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-vespa" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="bc-apt"       label="Apartment · sublease" width={400} height={820}><HAFrame screen="listing" role="buyer" listingId="l-apt"   palette={palette} density={tweaks.density} city={city} /></DCArtboard>
        </DCSection>

        {/* ───────── SELLER FLOW ───────── */}
        <DCSection id="seller-onboarding" title="Seller onboarding · profile → listing → pickup spot → timeline → published" subtitle="Five steps, all front-loaded. By the time the listing goes live, the marketplace already knows where and when buyers can collect — so chats start with a slot, not a guess.">
          <DCArtboard id="sf-profile"     label="01 · Profile"           width={400} height={820}><HAFrame screen="s-profile"     role="seller" palette={palette} density={tweaks.density} city={city} hideTabBar /></DCArtboard>
          <DCArtboard id="sf-listing"     label="02 · Listing"           width={400} height={820}><HAFrame screen="post"          role="seller" palette={palette} density={tweaks.density} city={city} hideTabBar /></DCArtboard>
          <DCArtboard id="sf-pickup-loc"  label="03 · Pickup location"   width={400} height={820}><HAFrame screen="s-pickup-loc"  role="seller" palette={palette} density={tweaks.density} city={city} hideTabBar /></DCArtboard>
          <DCArtboard id="sf-pickup-time" label="04 · Pickup timeline"   width={400} height={820}><HAFrame screen="s-pickup-time" role="seller" palette={palette} density={tweaks.density} city={city} hideTabBar /></DCArtboard>
          <DCArtboard id="sf-published"   label="05 · Listing published" width={400} height={820}><HAFrame screen="s-published"   role="seller" palette={palette} density={tweaks.density} city={city} hideTabBar /></DCArtboard>
        </DCSection>

        <DCSection id="seller-app" title="Seller · app surfaces" subtitle="The seller's daily app. Tab bar shows Browse · Search · Post · Inbox · Me — Post replaces Favorites. The wordmark's 'again' tints blue for sellers.">
          <DCArtboard id="se-browse" label="Seller · Browse"        width={400} height={820}><HAFrame screen="browse" role="seller" listingId="l-sofa" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="se-post"   label="Seller · Post a listing" width={400} height={820}><HAFrame screen="post"   role="seller" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="se-inbox"  label="Seller · Inbox · activity" width={400} height={820}><HAFrame screen="inbox" role="seller" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
        </DCSection>

        <DCSection id="seller-page" title="Seller · public pages" subtitle="A seller's page collects everything they're moving. Buyers can bundle several items into one trip.">
          <DCArtboard id="sp-maya"   label="Maya · Tel Aviv → Berlin"   width={400} height={820}><HAFrame screen="seller" role="buyer" sellerId="maya" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="sp-yael"   label="Inbar · Jerusalem → London" width={400} height={820}><HAFrame screen="seller" role="buyer" sellerId="yael" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
          <DCArtboard id="sp-bundle" label="Bundle · whole apartment"   width={400} height={820}><HAFrame screen="bundle" role="buyer" sellerId="maya" palette={palette} density={tweaks.density} city={city} /></DCArtboard>
        </DCSection>
      </DesignCanvas>

      {/* Tweaks */}
      <TweaksPanel title="Tweaks" defaultOpen={false}>
        <TweakSection title="Palette">
          <TweakRadio
            value={tweaks.palette}
            onChange={(v) => setTweak('palette', v)}
            options={[
              { value: 'default', label: 'Brand' },
              { value: 'cream',   label: 'Cream' },
              { value: 'bold',    label: 'Inverted' },
            ]}
          />
        </TweakSection>
        <TweakSection title="City filter">
          <TweakRadio
            value={city}
            onChange={(v) => { setCity(v); setTweak('city', v); }}
            options={[
              { value: 'tel-aviv',  label: 'Tel Aviv' },
              { value: 'jerusalem', label: 'Jerusalem' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Card density">
          <TweakRadio
            value={tweaks.density}
            onChange={(v) => setTweak('density', v)}
            options={[
              { value: 'two', label: '2 columns' },
              { value: 'one', label: '1 column' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
