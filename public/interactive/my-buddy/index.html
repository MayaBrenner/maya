<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-Book.otf") format("opentype");         font-weight:400; font-style:normal;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-BookItalic.otf") format("opentype");   font-weight:400; font-style:italic;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-Medium.otf") format("opentype");       font-weight:500; font-style:normal;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-MediumItalic.otf") format("opentype"); font-weight:500; font-style:italic;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-Bold.otf") format("opentype");         font-weight:700; font-style:normal;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-BoldItalic.otf") format("opentype");   font-weight:700; font-style:italic;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-ExtraBold.otf") format("opentype");    font-weight:800; font-style:normal;  font-display:swap; }
  @font-face { font-family:"P22 Mackinac"; src:url("fonts/P22Mackinac-ExtraBoldItalic.otf") format("opentype"); font-weight:800; font-style:italic; font-display:swap; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0 28px;
    font-family: "Montserrat", system-ui, sans-serif;
    min-height: 100vh;
  }
  #root { display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app-data.js"></script>
<script type="text/babel" src="app-ui.jsx"></script>
<script type="text/babel" src="app-screens-1.jsx"></script>
<script type="text/babel" src="app-screens-2.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>

<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(
  <MBFrame
    screen="onboarding"
    parkId="gan-gitara"
    paletteId="fresh"
    mapStyle="illustrated"
    hour={16}
    scale={0.65}
  />
);
</script>
</body>
</html>
